
events { }


http {
    upstream website    {
        ip_hash;                        # for sticky sessions, more below
        server                          localhost:1211 max_fails=1 fail_timeout=10s;
    }
    
    
    server {
        # only listen to https here
        #listen                          80;
        listen                          21;
        listen                          8888;
        #listen                          443;
        listen                          3000;
        listen                          3333;
        #listen                          5000;
        listen                          8080;
        listen                          8889;
        listen                          5555;
        listen                          25;
        listen                          465;
        listen                          587;
        listen                          [::]:80;
        server_name                     localhost;

        access_log                      /Users/ian/repos/public/network-listener/logs/nginx/localhost.access.log;
        error_log                       /Users/ian/repos/public/network-listener/logs/nginx/localhost.error.log;

        location / {
            proxy_pass                  http://localhost:1211;
            proxy_set_header            CLIENT $realip_remote_addr:$realip_remote_port;
            proxy_set_header            CLIENT_PORT $realip_remote_port;
            proxy_set_header            Host $host:$server_port;
            proxy_set_header            REMOTE_ADDR $realip_remote_addr;
            proxy_http_version          1.1;

            proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header            X-Forwarded-Proto http;
            proxy_redirect              http:// $scheme://;
        }
    }




}
