
events { }


http {
    upstream website    {
        ip_hash;                        # for sticky sessions, more below
        server                          localhost:1211 max_fails=3 fail_timeout=10;
    }
    
    
    server {
        # only listen to https here
        listen                          80;
        listen                          [::]:80;
        server_name                     localhost;

    }
}
